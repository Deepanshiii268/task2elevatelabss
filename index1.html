<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Flow • Daily Focus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style1.css" />
</head>

<body>
    <div class="ambient-glow glow-1"></div>
    <div class="ambient-glow glow-2"></div>

    <main class="app-card">
        <header class="app-header">
            <div>
                <span class="date-badge" id="current-date">Today's Focus</span>
                <h1>Tasks & Flow</h1>
            </div>
            <div class="stats-pill">
                <span id="completed-count">0</span> / <span id="total-count">0</span> done
            </div>
        </header>

        <div class="progress-track">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <form id="todo-form" class="todo-form">
            <div class="input-wrapper">
                <input type="text" id="todo-input" placeholder="What are you focusing on next?" autocomplete="off" required />
                <select id="todo-category" aria-label="Task category">
          <option value="Work">💼 Work</option>
          <option value="Personal">🌿 Personal</option>
          <option value="Urgent">⚡ Urgent</option>
        </select>
            </div>
            <button type="submit" id="add-btn" aria-label="Add task">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
      </button>
        </form>

        <ul id="todo-list" class="todo-list"></ul>

        <footer class="empty-state" id="empty-state">
            <div class="empty-icon">☕</div>
            <p>No active tasks. Take a breath or add one above.</p>
        </footer>
    </main>

    <script src="script1.js"></script>
</body>

</html>
